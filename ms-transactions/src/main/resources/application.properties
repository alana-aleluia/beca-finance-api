spring.application.name=ms-transactions
server.port=${SERVER_PORT:8082}
spring.datasource.url=${TRANSACTIONS_DB_URL:jdbc:postgresql://localhost:5434/transactions_db}
spring.datasource.username=${TRANSACTIONS_DB_USER:transactions_user}
spring.datasource.password=${TRANSACTIONS_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
integrations.ms1-url=${MS1_URL:http://localhost:8081}
integrations.mockapi-accounts-url=${MOCKAPI_ACCOUNTS_URL}
integrations.timeout-seconds=5
